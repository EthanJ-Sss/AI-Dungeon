<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关卡配置编辑器 - AI Dungeon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 30px;
            color: white;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .main {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 0;
        }

        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-right: 2px solid #e9ecef;
            max-height: 80vh;
            overflow-y: auto;
        }

        .content {
            padding: 30px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #495057;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(238, 9, 121, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .level-selector {
            margin-bottom: 20px;
        }

        .level-btn {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .level-btn:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .enemy-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #e9ecef;
            position: relative;
        }

        .enemy-card h3 {
            margin-bottom: 15px;
            color: #495057;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .enemy-card .remove-btn {
            padding: 5px 10px;
            font-size: 12px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 15px;
        }

        .skill-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }

        .skill-tag {
            padding: 8px 12px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .skill-tag:hover {
            border-color: #667eea;
        }

        .skill-tag.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 10px;
            margin-top: 10px;
        }

        .position-cell {
            width: 60px;
            height: 60px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: all 0.3s;
        }

        .position-cell:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .position-cell.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .output-section {
            background: #282c34;
            color: #abb2bf;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .output-section pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #e9ecef;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 2px solid #bee5eb;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            flex: 1;
            min-width: 150px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 24px;
            font-weight: bold;
        }

        .lava-blocks {
            margin-top: 15px;
        }

        .lava-block-item {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .lava-block-item input {
            width: 80px;
        }

        .monster-select {
            margin-bottom: 15px;
        }

        #monsterSearch {
            margin-bottom: 10px;
        }

        .monster-option {
            padding: 10px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: all 0.3s;
        }

        .monster-option:hover {
            border-color: #667eea;
            background: #f8f9fa;
        }

        .monster-option.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .monster-stats {
            font-size: 12px;
            margin-top: 5px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 关卡配置编辑器</h1>
            <p>可视化配置关卡敌人、环境、技能 | AI Dungeon Level Editor</p>
        </div>

        <div class="main">
            <!-- 侧边栏：关卡选择 -->
            <div class="sidebar">
                <h3 style="margin-bottom: 15px; color: #495057;">选择关卡</h3>
                <div class="level-selector" id="levelSelector">
                    <!-- 关卡按钮将通过JS生成 -->
                </div>
                <button class="btn btn-success" onclick="addNewLevel()" style="width: 100%;">
                    ➕ 新增关卡
                </button>
            </div>

            <!-- 主内容区 -->
            <div class="content">
                <div class="alert alert-info">
                    💡 <strong>提示</strong>: 点击左侧选择关卡，配置完成后点击"生成配置文件"导出JSON
                </div>

                <!-- 关卡基础信息 -->
                <h2 style="margin-bottom: 20px; color: #495057;">⚙️ 关卡基础配置</h2>
                
                <div class="stats-bar">
                    <div class="stat-card">
                        <h4>关卡ID</h4>
                        <p id="statLevelId">1</p>
                    </div>
                    <div class="stat-card">
                        <h4>敌人数量</h4>
                        <p id="statEnemyCount">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>总血量</h4>
                        <p id="statTotalHP">0</p>
                    </div>
                    <div class="stat-card">
                        <h4>环境伤害</h4>
                        <p id="statBurnDamage">0/秒</p>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>关卡名称</label>
                        <input type="text" id="levelName" placeholder="例: 火山入口·训练场">
                    </div>
                    <div class="form-group">
                        <label>难度</label>
                        <select id="levelDifficulty">
                            <option value="新手">⭐ 新手</option>
                            <option value="简单">⭐⭐ 简单</option>
                            <option value="中等">⭐⭐⭐ 中等</option>
                            <option value="困难">⭐⭐⭐⭐ 困难</option>
                            <option value="Boss">⭐⭐⭐⭐⭐ Boss</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>关卡描述</label>
                    <textarea id="levelDescription" rows="3" placeholder="关卡的详细描述..."></textarea>
                </div>

                <div class="grid-3">
                    <div class="form-group">
                        <label>关卡时长（秒）</label>
                        <input type="number" id="levelDuration" value="60" min="30" max="120">
                    </div>
                    <div class="form-group">
                        <label>环境燃烧（伤害/秒）</label>
                        <input type="number" id="levelBurnDamage" value="5" min="0" max="50" onchange="updateStats()">
                    </div>
                    <div class="form-group">
                        <label>场景</label>
                        <select id="levelScene">
                            <option value="volcano">🌋 火山</option>
                            <option value="ice">❄️ 冰原</option>
                            <option value="forest">🌲 森林</option>
                            <option value="desert">🏜️ 沙漠</option>
                        </select>
                    </div>
                </div>

                <!-- 熔岩地块配置 -->
                <div class="form-group">
                    <label>熔岩地块配置（可选）</label>
                    <div class="lava-blocks" id="lavaBlocks">
                        <button class="btn btn-secondary" onclick="addLavaBlock()">➕ 添加熔岩地块</button>
                    </div>
                </div>

                <hr style="margin: 30px 0; border: none; border-top: 2px solid #e9ecef;">

                <!-- 敌人配置 -->
                <h2 style="margin-bottom: 20px; color: #495057;">👾 敌人配置</h2>
                
                <div id="enemiesList">
                    <!-- 敌人卡片将通过JS生成 -->
                </div>

                <button class="btn btn-success" onclick="addEnemy()">
                    ➕ 添加敌人
                </button>

                <!-- 操作按钮 -->
                <div class="actions">
                    <button class="btn btn-primary" onclick="generateJSON()">
                        📄 生成配置文件
                    </button>
                    <button class="btn btn-success" onclick="copyToClipboard()">
                        📋 复制到剪贴板
                    </button>
                    <button class="btn btn-secondary" onclick="loadFromJSON()">
                        📂 从JSON导入
                    </button>
                    <button class="btn btn-danger" onclick="resetLevel()">
                        🔄 重置关卡
                    </button>
                </div>

                <!-- 输出区域 -->
                <div class="output-section" id="outputSection">
                    <pre id="jsonOutput">配置完成后，点击"生成配置文件"查看JSON输出</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局数据
        let currentLevelId = 1;
        let levels = {};
        let enemyCounter = 0;
        let lavaBlockCounter = 0;

        // 可用的怪物列表（从monsters.json）
        const availableMonsters = [
            { id: "monster_training_dummy_attack", name: "训练假人·攻击型", hp: 160, damage: 16, element: "neutral" },
            { id: "monster_training_dummy_defense", name: "训练假人·防御型", hp: 200, damage: 12, element: "earth" },
            { id: "monster_training_dummy_control", name: "训练假人·突袭型", hp: 170, damage: 14, element: "fire" },
            { id: "monster_magma_brute", name: "熔岩巨兽", hp: 520, damage: 30, element: "earth" },
            { id: "monster_flame_sentinel", name: "火焰哨兵", hp: 300, damage: 38, element: "fire" },
            { id: "monster_rock_thrower_001", name: "火山投石手·甲", hp: 260, damage: 32, element: "earth" },
            { id: "monster_fire_tank", name: "烈焰卫士", hp: 500, damage: 28, element: "fire" },
            { id: "monster_fire_healer", name: "火焰祭司", hp: 320, damage: 25, element: "fire" },
            { id: "monster_fire_mage", name: "火焰法师", hp: 300, damage: 42, element: "fire" },
            { id: "monster_fire_charger_001", name: "烈焰冲锋者·甲", hp: 360, damage: 38, element: "fire" },
            { id: "monster_fire_charger_002", name: "烈焰冲锋者·乙", hp: 360, damage: 38, element: "fire" },
            { id: "monster_fire_charger_003", name: "烈焰冲锋者·丙", hp: 360, damage: 38, element: "fire" },
            { id: "boss_volcano_lord", name: "火山领主·伊格尼斯", hp: 950, damage: 48, element: "fire" }
        ];

        // 初始化
        function init() {
            // 初始化5个关卡
            for (let i = 1; i <= 5; i++) {
                levels[i] = {
                    id: i,
                    name: `第${i}关`,
                    description: "",
                    difficulty: "新手",
                    scene: "volcano",
                    duration: 60,
                    burnDamage: 5,
                    unlocked: i === 1,
                    lavaBlocks: [],
                    enemies: []
                };
            }
            renderLevelSelector();
            loadLevel(1);
        }

        // 渲染关卡选择器
        function renderLevelSelector() {
            const selector = document.getElementById('levelSelector');
            selector.innerHTML = '';
            Object.keys(levels).forEach(levelId => {
                const level = levels[levelId];
                const btn = document.createElement('button');
                btn.className = 'level-btn' + (currentLevelId == levelId ? ' active' : '');
                btn.innerHTML = `
                    <strong>第${level.id}关</strong><br>
                    <small>${level.name} - ${level.difficulty}</small>
                `;
                btn.onclick = () => loadLevel(levelId);
                selector.appendChild(btn);
            });
        }

        // 加载关卡
        function loadLevel(levelId) {
            currentLevelId = levelId;
            const level = levels[levelId];
            
            document.getElementById('levelName').value = level.name;
            document.getElementById('levelDescription').value = level.description;
            document.getElementById('levelDifficulty').value = level.difficulty;
            document.getElementById('levelScene').value = level.scene;
            document.getElementById('levelDuration').value = level.duration;
            document.getElementById('levelBurnDamage').value = level.burnDamage;

            renderLevelSelector();
            renderEnemies();
            renderLavaBlocks();
            updateStats();
        }

        // 保存当前关卡
        function saveCurrentLevel() {
            const level = levels[currentLevelId];
            level.name = document.getElementById('levelName').value;
            level.description = document.getElementById('levelDescription').value;
            level.difficulty = document.getElementById('levelDifficulty').value;
            level.scene = document.getElementById('levelScene').value;
            level.duration = parseInt(document.getElementById('levelDuration').value);
            level.burnDamage = parseInt(document.getElementById('levelBurnDamage').value);
        }

        // 渲染敌人列表
        function renderEnemies() {
            const container = document.getElementById('enemiesList');
            const level = levels[currentLevelId];
            
            container.innerHTML = '';
            level.enemies.forEach((enemy, index) => {
                const card = document.createElement('div');
                card.className = 'enemy-card';
                card.innerHTML = `
                    <h3>
                        敌人 ${index + 1}
                        <button class="btn btn-danger remove-btn" onclick="removeEnemy(${index})">删除</button>
                    </h3>
                    <div class="monster-select">
                        <label>选择怪物</label>
                        <select onchange="updateEnemyMonster(${index}, this.value)">
                            <option value="">-- 请选择 --</option>
                            ${availableMonsters.map(m => `
                                <option value="${m.id}" ${enemy.characterId === m.id ? 'selected' : ''}>
                                    ${m.name} (HP:${m.hp} DMG:${m.damage})
                                </option>
                            `).join('')}
                        </select>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>位置 X</label>
                            <input type="number" value="${enemy.position.x}" min="0" max="2" 
                                onchange="updateEnemyPosition(${index}, 'x', this.value)">
                        </div>
                        <div class="form-group">
                            <label>位置 Y</label>
                            <input type="number" value="${enemy.position.y}" min="0" max="2" 
                                onchange="updateEnemyPosition(${index}, 'y', this.value)">
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 添加敌人
        function addEnemy() {
            const level = levels[currentLevelId];
            level.enemies.push({
                characterId: "",
                position: { x: 0, y: 0 }
            });
            renderEnemies();
            updateStats();
        }

        // 删除敌人
        function removeEnemy(index) {
            const level = levels[currentLevelId];
            level.enemies.splice(index, 1);
            renderEnemies();
            updateStats();
        }

        // 更新敌人怪物
        function updateEnemyMonster(index, monsterId) {
            const level = levels[currentLevelId];
            level.enemies[index].characterId = monsterId;
            updateStats();
        }

        // 更新敌人位置
        function updateEnemyPosition(index, axis, value) {
            const level = levels[currentLevelId];
            level.enemies[index].position[axis] = parseInt(value);
        }

        // 渲染熔岩地块
        function renderLavaBlocks() {
            const container = document.getElementById('lavaBlocks');
            const level = levels[currentLevelId];
            
            let html = '<button class="btn btn-secondary" onclick="addLavaBlock()">➕ 添加熔岩地块</button><br><br>';
            
            level.lavaBlocks.forEach((block, index) => {
                html += `
                    <div class="lava-block-item">
                        <input type="number" value="${block.row}" placeholder="行" 
                            onchange="updateLavaBlock(${index}, 'row', this.value)">
                        <input type="number" value="${block.col}" placeholder="列" 
                            onchange="updateLavaBlock(${index}, 'col', this.value)">
                        <button class="btn btn-danger" onclick="removeLavaBlock(${index})" style="padding: 8px 12px;">删除</button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 添加熔岩地块
        function addLavaBlock() {
            const level = levels[currentLevelId];
            level.lavaBlocks.push({ row: 2, col: 5 });
            renderLavaBlocks();
        }

        // 删除熔岩地块
        function removeLavaBlock(index) {
            const level = levels[currentLevelId];
            level.lavaBlocks.splice(index, 1);
            renderLavaBlocks();
        }

        // 更新熔岩地块
        function updateLavaBlock(index, field, value) {
            const level = levels[currentLevelId];
            level.lavaBlocks[index][field] = parseInt(value);
        }

        // 更新统计数据
        function updateStats() {
            const level = levels[currentLevelId];
            document.getElementById('statLevelId').textContent = level.id;
            document.getElementById('statEnemyCount').textContent = level.enemies.length;
            document.getElementById('statBurnDamage').textContent = level.burnDamage + '/秒';
            
            let totalHP = 0;
            level.enemies.forEach(enemy => {
                const monster = availableMonsters.find(m => m.id === enemy.characterId);
                if (monster) totalHP += monster.hp;
            });
            document.getElementById('statTotalHP').textContent = totalHP;
        }

        // 生成JSON
        function generateJSON() {
            saveCurrentLevel();
            const output = Object.values(levels);
            const json = JSON.stringify(output, null, 2);
            document.getElementById('jsonOutput').textContent = json;
            
            // 显示成功提示
            alert('✅ 配置文件已生成！您可以复制下方的JSON代码，替换到 levels.json 文件中。');
        }

        // 复制到剪贴板
        function copyToClipboard() {
            const output = document.getElementById('jsonOutput').textContent;
            if (output === '配置完成后，点击"生成配置文件"查看JSON输出') {
                alert('⚠️ 请先点击"生成配置文件"');
                return;
            }
            navigator.clipboard.writeText(output).then(() => {
                alert('✅ 已复制到剪贴板！');
            });
        }

        // 从JSON导入
        function loadFromJSON() {
            const json = prompt('请粘贴JSON配置：');
            if (!json) return;
            
            try {
                const data = JSON.parse(json);
                levels = {};
                data.forEach(level => {
                    levels[level.id] = level;
                });
                renderLevelSelector();
                loadLevel(currentLevelId);
                alert('✅ 导入成功！');
            } catch (e) {
                alert('❌ JSON格式错误：' + e.message);
            }
        }

        // 重置关卡
        function resetLevel() {
            if (confirm('确定要重置当前关卡吗？')) {
                levels[currentLevelId] = {
                    id: currentLevelId,
                    name: `第${currentLevelId}关`,
                    description: "",
                    difficulty: "新手",
                    scene: "volcano",
                    duration: 60,
                    burnDamage: 5,
                    unlocked: currentLevelId === 1,
                    lavaBlocks: [],
                    enemies: []
                };
                loadLevel(currentLevelId);
                alert('✅ 已重置关卡');
            }
        }

        // 新增关卡
        function addNewLevel() {
            const newId = Object.keys(levels).length + 1;
            levels[newId] = {
                id: newId,
                name: `第${newId}关`,
                description: "",
                difficulty: "新手",
                scene: "volcano",
                duration: 60,
                burnDamage: 5,
                unlocked: false,
                lavaBlocks: [],
                enemies: []
            };
            renderLevelSelector();
            loadLevel(newId);
        }

        // 页面加载时初始化
        window.onload = init;
    </script>
</body>
</html>
